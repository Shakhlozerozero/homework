<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Form</title>
     <link rel="stylesheet" href="style.css">
     <script src="script.js"></script>
</head>

<body>
     <form class="form">
           <fieldset class="hidden">
               <h3 class="title">Your personal data</h3>
                <label class="label">
                     Your name
                    <input  class="input" type="text"    placeholder="Name" required>
                </label>
                <label  class="label">
                    Your age
                    <input   class="input"  type="number" inputmode="numeric" placeholder="Age" required>
                </label>
                <label  class="label">
                    Your phone number 
                    <input    class="input" type="tel" placeholder="Phone number" required>
               </label>
                <label  class="label">
                    Your email
                    <input   class="input"  type="email" placeholder="Email" required>
                </label>
                <label  class="label">Message</label>
                <textarea class="textarea" placeholder="Your message"></textarea>
               <label class="label">
               <input   class="checkbox-input" type="checkbox"  required>
               <span class="checkbox-text">
                    I accept the rules
               </span>
          </label>
          <button class="button">Send</button>
           </fieldset>
      </form>
</body>
</html>
